}
function quiz(id,title,instructions,matching=false,photos=null) {
  const questions = quizzes[id];
  const state = states[id];
  return '<section class="quiz" data-quiz="'+id+'"><h2>'+title+'</h2><p class="description">'+instructions+'</p><div class="questions '+(photos?'photo-q':matching?'match':'')+'">'+questions.map(({prompt,choices},i)=>{
    const label = id+'-'+i;
    const promptHTML = '<div class="q-top"><span class="number" aria-hidden="true">'+(i+1)+'</span><p id="'+label+'">'+safe(prompt)+'</p></div>';
    const choicesHTML = matching
      ? '<select data-i="'+i+'" aria-labelledby="'+label+'"><option value="">Choose an answer</option>'+choices.map(choice=>'<option value="'+safe(choice)+'"'+(choice===state.answers[i]?' selected':'')+'>'+safe(choice)+'</option>').join('')+'</select>'
      : '<div class="choices" role="group" aria-labelledby="'+label+'">'+choices.map(choice=>'<button type="button" class="choice" data-i="'+i+'" data-choice="'+safe(choice)+'" aria-pressed="'+(state.answers[i]===choice)+'">'+safe(choice)+'</button>').join('')+'</div>';
    return '<div class="q">'+(photos?'<img src="'+photos[i]+'" alt="">':'')+promptHTML+choicesHTML+'<p class="feedback" hidden></p></div>';
  }).join('')+'</div>'+controls()+'</section>';
}
function updateQuiz(section) {
  const id = section.dataset.quiz;
  const state = states[id];
  let right = 0, done = 0;
  section.querySelectorAll('.q').forEach((row,i)=>{
    const {answer,evidence} = quizzes[id][i];
    const isRight = state.answers[i]===answer;
    const answered = state.answers[i]!=='';
    const display = state.checked && answered;
    right += Number(isRight);
    done += Number(answered);
    row.classList.toggle('good',display && isRight);
    row.classList.toggle('bad',display && !isRight);
    const feedback = row.querySelector('.feedback');
    feedback.hidden = !state.key && !display;
    feedback.textContent = state.key?'Answer: '+answer+(evidence?' · '+evidence:''):isRight?'Correct.':'Try again.';
  });
  const total = quizzes[id].length;
  section.querySelector('.score').textContent = state.checked?right+' of '+total+' correct.'+(done<total?' '+(total-done)+' unanswered.':''):'';
  section.querySelector('[data-action="key"]').textContent = state.key?'Hide answer key':'Show answer key';
}
function setAnswer(section,index,value) {
  const state = states[section.dataset.quiz];
  state.answers[index] = value;
  state.checked = false;
  section.querySelectorAll('button[data-i="'+index+'"]').forEach(control=>control.setAttribute('aria-pressed',control.dataset.choice===value));
  updateQuiz(section);
}
function loadVideo(index) {
  const clip = videos[index];
  const frame = document.createElement('iframe');
  frame.title = 'Unit 6D Listening '+(index+1)+' · Track '+clip.track;
  frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  frame.allowFullscreen = true;
  frame.referrerPolicy = 'strict-origin-when-cross-origin';
  frame.src = 'https://www.youtube-nocookie.com/embed/'+clip.id+'?autoplay=1&rel=0&playsinline=1';
  document.querySelector('#player-'+index).replaceChildren(frame);
  frame.focus();
}

function pick(group,index,label,choices) {

}
function poll(group,title,description,lines,choices) {

  ).join('')+'</div>');
}

}
function speakingTask() {
  return card('Exercise 10 · Discuss in groups of three','<ol class="prompt-list"><li>Choose a statement and decide what you think.</li><li>Give a reason and a short example.</li><li>Invite another person to speak. At the end, say whose argument you agreed with most and why.</li></ol><div class="topic-grid" role="group" aria-label="Discussion topics">'+topics.map((topic,i)=>'<button class="choice topic" data-topic="'+i+'" aria-pressed="'+(i===speaking.topic)+'"><span class="number">'+(i+1)+'</span>'+safe(topic)+'</button>').join('')+'</div><div class="tile speaking-frame"><h3 id="active-topic">'+safe(topics[speaking.topic])+'</h3><div class="choices" role="group" aria-label="Your opinion">'+['Agree','Disagree','Not sure'].map(stance=>'<button class="choice" data-stance="'+stance+'" aria-pressed="'+(stance===speaking.stance)+'">'+stance+'</button>').join('')+'</div><p class="model-line" id="stance-line" aria-live="polite">'+stanceLine()+'</p></div><details><summary>Read a model discussion</summary><div class="dialogue"><p><b>A</b> I think English helps you get a good job because you can talk to customers from other countries.</p><p><b>B</b> True, but some jobs need other skills more. What about you, Mia?</p><p><b>C</b> I suppose so. For example, a great cook can find work in a local restaurant. English might still help later.</p></div></details>');
}
function stanceLine() {
  return {'Agree':'I agree because … For example, … What do you think, …?',
    'Disagree':'I don’t think so. I think … because … What about you, …?',
    'Not sure':'I’m not sure about that. It depends on … What do you think, …?'}[speaking.stance] || 'Choose an opinion to get a sentence starter.';
}
function render() {
  stage = Math.max(0,steps.findIndex(([id])=>location.hash==='#'+id));
  const [id,label,title,subtitle] = steps[stage];
  nav.innerHTML = steps.map(([slug,name],i)=>'<a class="nav-link" href="#'+slug+'"'+(i===stage?' aria-current="page"':'')+'><span>'+String(i+1).padStart(2,'0')+'</span>'+name+'</a>').join('');
  const cover = id==='warm-up';
  const hero = '<section class="hero '+(cover?'intro-hero':id==='speaking'?'accent':'')+'"><div><p class="eyebrow">UNIT 6D · '+label.toUpperCase()+'</p><h1 tabindex="-1">'+title+'</h1><p class="sub">'+subtitle+'</p>'+(cover?'<div class="tag-line"><span class="hero-tag">2 videos</span><span class="hero-tag">Agreeing &amp; disagreeing</span></div>':'')+'</div>'+(cover?'<img class="hero-photo" src="'+images.cover+'" alt="A person walking across a tightrope above a city">':'')+'</section>';
  const content = [
    ()=>poll('risk','Exercise 1 · Would you…?','Choose an answer for each situation. Tell your partner why you made one of your choices.',risks,['Yes, I would','No, I wouldn’t','Not sure']),
    ()=>video(0)+quiz('people','Exercise 2 · Who did what?','Match each person to the phrase that describes them.',true,images.faces)+quiz('speaker','Exercise 3 · Simon or Kate?','Watch again and choose the person who says each line.'),
    ()=>language()+quiz('phrases','Exercise 4A · Which expressions did you hear?','Think back to Part 1. For each expression, choose whether Simon or Kate used it.')+quiz('strength','Exercise 4B · Sort by strength','Choose how strong each response sounds.',true)+poll('opinion','Exercise 5 · What do you think?','Choose your opinion for each statement. Compare two answers with a partner and explain your reasons.',opinions,['Strongly agree','Agree','Not sure','Disagree','Strongly disagree']),
    ()=>video(1)+quiz('news','Exercise 6 · Listen for the main idea','Watch Part 2 and choose Jack’s news.')+quiz('details','Exercise 7 · Listen for details','Watch again and choose the correct answer.'),
    ()=>turnSkill()+quiz('turns','Exercise 8 · Why do the speakers say this?','Read the phrases aloud with a partner. Choose S if the speaker is saying sorry, or E if the speaker is encouraging someone to join in.'),
    ()=>speakingTask()
  ][stage]();
  const back = steps[stage-1], next = steps[stage+1];
  page.innerHTML = hero+content+'<div class="sequence">'+(back?'<a class="button" href="#'+back[0]+'">← '+back[1]+'</a>':'<span></span>')+(next?'<a class="button primary" href="#'+next[0]+'">'+next[1]+' →</a>':'<a class="button primary" href="#warm-up">Back to warm-up ↗</a>')+'</div>';
  page.querySelectorAll('[data-quiz]').forEach(updateQuiz);
}
page.addEventListener('click',event=>{
  const target = event.target.closest('button');
  if(!target) return;
  if(target.hasAttribute('data-pick')) {
    polls[target.dataset.poll+target.dataset.row] = target.dataset.pick;
    target.parentElement.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',button===target));
  }
  if(target.hasAttribute('data-topic')) {
    speaking.topic = Number(target.dataset.topic);
    target.parentElement.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',button===target));
    document.querySelector('#active-topic').textContent = topics[speaking.topic];
  }
  if(target.hasAttribute('data-stance')) {
    speaking.stance = target.dataset.stance;
    target.parentElement.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',button===target));
    document.querySelector('#stance-line').textContent = stanceLine();
  }
});
page.addEventListener('change',event=>{
  const target = event.target;
  if(target.matches('select[data-i]')) setAnswer(target.closest('[data-quiz]'),Number(target.dataset.i),target.value);
});
page.addEventListener('click',event=>{
  const target = event.target.closest('button');
  if(!target) return;
  const action = target.dataset.action;
  if(action==='video-0'||action==='video-1') {
    loadVideo(Number(action.at(-1)));
    return;
  }
  const section = target.closest('[data-quiz]');
  if(!section) return;
  if(target.hasAttribute('data-choice')) return setAnswer(section,Number(target.dataset.i),target.dataset.choice);
  const state = states[section.dataset.quiz];
  if(action==='check') state.checked = true;
  if(action==='key') state.key = !state.key;
  if(action==='reset') {
    state.answers.fill('');
    state.checked = false;
    state.key = false;
    section.querySelectorAll('button[data-choice]').forEach(control=>control.setAttribute('aria-pressed','false'));
    section.querySelectorAll('select').forEach(control=>control.value='');
  }
  updateQuiz(section);
});
window.addEventListener('hashchange',()=>{
  if(location.hash==='#lesson') return;
  render();
  window.scrollTo(0,0);
  page.querySelector('h1').focus({preventScroll:true});
});
render();
</script>
</body>
</html>
